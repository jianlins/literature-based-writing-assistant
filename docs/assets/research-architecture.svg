<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Literature-Based Writing Assistant architecture</title>
  <desc id="desc">The Literature-Based Writing Assistant connects chatbot apps with a visible browser, Zotero, a local manuscript project, and Google Docs or Overleaf. Each connection is labeled with the skill or capability that enables it.</desc>
  <defs>
    <style>
      .canvas { fill: #f8fafc; } .title { font: 700 31px system-ui, sans-serif; fill: #102a43; } .sub { font: 400 16px system-ui, sans-serif; fill: #627d98; } .eyebrow { font: 700 12px system-ui, sans-serif; letter-spacing: 1.5px; fill: #829ab1; } .head { font: 700 21px system-ui, sans-serif; fill: #102a43; } .body { font: 400 14px system-ui, sans-serif; fill: #486581; } .center-head { font: 700 25px system-ui, sans-serif; fill: white; } .center-body { font: 500 14px system-ui, sans-serif; fill: #dbeafe; } .pill { font: 700 12px system-ui, sans-serif; fill: #1d4ed8; } .note { font: 500 13px system-ui, sans-serif; fill: #627d98; } .card { fill: white; stroke: #d9e2ec; stroke-width: 1.5; } .line { fill: none; stroke: #60a5fa; stroke-width: 3; stroke-linecap: round; marker-start: url(#arrow); marker-end: url(#arrow); } .pill-box { fill: white; stroke: #bfdbfe; stroke-width: 1.2; }
    </style>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#102a43" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#60a5fa"/></marker>
  </defs>
  <rect class="canvas" width="1200" height="720" rx="24"/>
  <text class="title" x="60" y="65">Literature-Based Writing Assistant</text>
  <text class="sub" x="60" y="93">Architecture for literature-based academic writing.</text>

  <!-- Connection lines first, so cards remain visually clean. -->
  <path class="line" d="M399 243L487 304"/><path class="line" d="M801 243L713 304"/><path class="line" d="M399 473L487 412"/><path class="line" d="M801 473L713 412"/>

  <!-- Four surrounding systems -->
  <g filter="url(#shadow)">
    <rect class="card" x="120" y="174" width="279" height="138" rx="18"/>
    <circle cx="153" cy="211" r="17" fill="#0ea5e9"/><path d="M144 211h18M153 202v18M147 205l12 12M159 205l-12 12" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <text class="eyebrow" x="184" y="207">DISCOVER</text><text class="head" x="144" y="252">Visible browser</text><text class="body" x="144" y="279">Find and inspect sources</text>

    <rect class="card" x="801" y="174" width="279" height="138" rx="18"/>
    <circle cx="834" cy="211" r="17" fill="#7c3aed"/><path d="M825 205h18v14h-18zM829 202h10M829 223h10" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <text class="eyebrow" x="865" y="207">ORGANIZE</text><text class="head" x="825" y="252">Zotero</text><text class="body" x="825" y="279">Keep references and citations</text>

    <rect class="card" x="120" y="404" width="279" height="138" rx="18"/>
    <circle cx="153" cy="441" r="17" fill="#f97316"/><path d="M144 435h9l3 3h16v14h-28z" fill="none" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
    <text class="eyebrow" x="184" y="437">PRESERVE</text><text class="head" x="144" y="482">Local project</text><text class="body" x="144" y="509">Manuscript and audit trail</text>

    <rect class="card" x="801" y="404" width="279" height="138" rx="18"/>
    <circle cx="834" cy="441" r="17" fill="#db2777"/><path d="M827 432h13v18h-13zM830 437h7M830 442h7M830 447h5" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <text class="eyebrow" x="865" y="437">WRITE</text><text class="head" x="825" y="482">Google Docs / Overleaf</text><text class="body" x="825" y="509">Draft, collaborate, and review</text>
  </g>

  <!-- Central coordinator -->
  <g filter="url(#shadow)">
    <rect x="466" y="251" width="268" height="214" rx="32" fill="#1d4ed8"/>
    <circle cx="600" cy="302" r="27" fill="#60a5fa"/><path d="M585 302h30M600 287v30M589 291l22 22M611 291l-22 22" stroke="white" stroke-width="2.3" stroke-linecap="round"/>
    <text class="center-head" x="511" y="363">Chatbot apps</text><text class="center-body" x="501" y="394">Codex · Antigravity · OpenCode</text><line x1="499" y1="416" x2="701" y2="416" stroke="#60a5fa" stroke-width="1"/><text class="center-body" x="510" y="443">Coordinate the work</text>
  </g>

  <!-- Lightweight labels attached to the architectural connections. -->
  <g filter="url(#shadow)">
    <rect class="pill-box" x="373" y="259" width="137" height="28" rx="14"/><text class="pill" x="389" y="278">Visible Research</text>
    <rect class="pill-box" x="691" y="259" width="116" height="28" rx="14"/><text class="pill" x="710" y="278">Zotero CLI</text>
    <rect class="pill-box" x="371" y="431" width="142" height="28" rx="14"/><text class="pill" x="389" y="450">Project workspace</text>
    <rect class="pill-box" x="679" y="431" width="136" height="28" rx="14"/><text class="pill" x="698" y="450">Docs / Overleaf</text>
  </g>

  <line x1="120" y1="612" x2="1080" y2="612" stroke="#d9e2ec" stroke-width="1"/>
  <text class="note" x="600" y="650" text-anchor="middle">Connections use the relevant skill; the researcher remains in control of sources, decisions, and sharing.</text>
</svg>
